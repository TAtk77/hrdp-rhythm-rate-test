<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HRDP Identification Drill</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700&family=Lato:wght@300;400;700&display=swap');

:root {
  --bg:        #0d1117;
  --surface:   #161c26;
  --card:      #1c2535;
  --border:    #263045;
  --accent:    #1e6fb5;
  --accent2:   #2491d4;
  --red:       #cb2c21;
  --green:     #1e7e4a;
  --green-lit: #27ae60;
  --red-lit:   #e74c3c;
  --text:      #d0d9e8;
  --muted:     #7a8fa8;
  --label:     #5b8fbf;
  --white:     #f0f4fa;
}
:root.light {
  --bg:        #eef2f7;
  --surface:   #dde5f0;
  --card:      #f4f7fb;
  --border:    #b8c8de;
  --accent:    #1e6fb5;
  --accent2:   #1a7abf;
  --red:       #c0392b;
  --green:     #1e7e4a;
  --green-lit: #1a7a40;
  --red-lit:   #c0392b;
  --text:      #1a2535;
  --muted:     #4a6480;
  --label:     #83b9f0;
  --white:     #0d1a2e;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Lato', sans-serif;
  font-size: 15px;
  line-height: 1.6;
  min-height: 100vh;
  transition: background .25s, color .25s;
}

/* ── HEADER ── */
header {
  background: linear-gradient(135deg, #0a1a2e 0%, #0f2a4a 60%, #12355e 100%);
  border-bottom: 2px solid var(--accent);
  padding: 24px 24px 20px;
  position: relative;
}
:root.light header { background: linear-gradient(135deg, #1a3a5c, #1e5599, #1a6abf); }
header::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, var(--red), var(--accent), var(--accent2));
}
.header-inner {
  max-width: 900px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  gap: 16px;
}
.header-text { flex: 1; }
.header-eyebrow {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 12px; font-weight: 600;
  letter-spacing: 3px; text-transform: uppercase;
  color: var(--label); margin-bottom: 4px;
}
header h1 {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 32px; font-weight: 700;
  color: #f0f4fa; line-height: 1.1;
}
header h1 span { color: var(--accent2); }
.header-sub { font-size: 13px; color: #7a9ab8; margin-top: 4px; }

#theme-toggle {
  background: rgba(255,255,255,.1);
  border: 1px solid rgba(255,255,255,.2);
  color: #f0f4fa; width: 34px; height: 34px;
  border-radius: 6px; cursor: pointer; font-size: 16px;
  display: flex; align-items: center; justify-content: center;
  transition: background .2s; flex-shrink: 0;
}
#theme-toggle:hover { background: rgba(255,255,255,.2); }

/* ── CONTROLS BAR ── */
.controls {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 12px 24px;
  display: flex;
  align-items: center;
  gap: 16px;
  position: sticky;
  top: 0;
  z-index: 100;
}
.controls-inner {
  max-width: 900px;
  margin: 0 auto;
  width: 100%;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: nowrap;
}
.progress-wrap {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13px;
  color: var(--muted);
}
.progress-bar-outer {
  width: 140px; height: 6px;
  background: var(--border);
  border-radius: 3px; overflow: hidden;
}
.progress-bar-inner {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  border-radius: 3px;
  transition: width .3s;
  width: 0%;
}
#progress-text { min-width: 50px; }
.spacer { flex: 1; }
#save-status {
  font-size: 12px; opacity: 0;
  transition: opacity .4s;
  min-width: 80px; text-align: right;
}
.score-btn {
  background: var(--accent); border: none;
  color: #fff; padding: 7px 18px;
  border-radius: 4px; font-family: 'Lato', sans-serif;
  font-size: 13px; font-weight: 700;
  cursor: pointer; letter-spacing: 1px;
  text-transform: uppercase; transition: background .15s;
}
.score-btn:hover { background: var(--accent2); }
.score-btn:disabled { opacity: .35; cursor: not-allowed; }

/* ── SCORE SUMMARY ── */
#score-summary {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.75);
  z-index: 500;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
#score-summary.show { display: flex; }
.score-card-wrap {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 32px 36px;
  max-width: 480px;
  width: 100%;
  box-shadow: 0 20px 60px rgba(0,0,0,.5);
  text-align: center;
}
.score-card-wrap h2 {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 22px; font-weight: 700;
  color: var(--white);
  margin-bottom: 20px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
}
.total-score-row {
  background: linear-gradient(135deg, #0f2a4a, #0a2040);
  border: 1px solid var(--accent);
  border-radius: 6px; padding: 20px 24px;
  display: flex; align-items: center;
  justify-content: space-between; margin-bottom: 16px;
}
:root.light .total-score-row { background: linear-gradient(135deg, #cddaed, #b8ccdf); }
.total-score-num {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 48px; font-weight: 700;
  color: var(--accent2); line-height: 1;
}
.total-score-label {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 12px; letter-spacing: 2px;
  text-transform: uppercase; color: var(--label);
  margin-bottom: 4px;
}
.pass-badge, .fail-badge {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 20px; font-weight: 700;
  padding: 6px 18px; border-radius: 4px;
}
.pass-badge { background: var(--green); color: #fff; }
.fail-badge { background: var(--red); color: #fff; }
.reset-btn {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--muted); padding: 8px 18px;
  border-radius: 4px; font-family: 'Lato', sans-serif;
  font-size: 13px; cursor: pointer;
  transition: all .15s; margin-top: 16px;
}
.reset-btn:hover { border-color: var(--accent); color: var(--accent2); }

/* ── MAIN ── */
main {
  max-width: 900px;
  margin: 0 auto;
  padding: 20px 24px 24px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* ── QUESTION CARD ── */
.q-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
  transition: border-color .2s;
}
.q-card.correct { border-color: var(--green-lit); }
.q-card.wrong   { border-color: var(--red-lit); }

.q-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 16px 8px;
}
.q-num {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 11px; font-weight: 700;
  letter-spacing: 2px; text-transform: uppercase;
  color: var(--label);
}
.q-status { font-size: 18px; margin-left: auto; }

/* ── STRIP IMAGE (wide HRDP trend format) ── */
.strip-wrap {
  padding: 0 16px 12px;
}
.strip-img {
  width: 100%;
  border-radius: 6px;
  display: block;
  border: 1px solid var(--border);
  background: #fff;
  object-fit: contain;
}

/* ── CHOICES ── */
.choices {
  padding: 0 16px 16px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.choice-btn {
  background: var(--surface);
  border: 2px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-family: 'Lato', sans-serif;
  font-size: 14px; font-weight: 700;
  padding: 14px 16px;
  cursor: pointer;
  text-align: center;
  transition: all .15s;
  letter-spacing: .3px;
}
.choice-btn:hover:not(:disabled) {
  background: var(--accent);
  border-color: var(--accent2);
  color: #fff;
}
.choice-btn:disabled { cursor: default; }
.choice-btn.correct {
  background: #0a2016;
  border-color: var(--green-lit);
  color: #7de0a0;
}
.choice-btn.wrong {
  background: #200a0a;
  border-color: var(--red-lit);
  color: #e08080;
}
.choice-btn.reveal {
  background: #0a2016;
  border-color: var(--green-lit);
  color: #7de0a0;
  opacity: .6;
}
:root.light .choice-btn.correct { background: #c8eeda; color: #0d4a24; }
:root.light .choice-btn.wrong   { background: #f5d0d0; color: #6b1010; }
:root.light .choice-btn.reveal  { background: #c8eeda; color: #0d4a24; opacity: .7; }

/* ── FEEDBACK ── */
.feedback {
  margin: 0 16px 14px;
  font-size: 13px;
  padding: 8px 12px;
  border-radius: 4px;
  display: none;
  line-height: 1.5;
}
.feedback.correct {
  background: #0a2016;
  border-left: 3px solid var(--green-lit);
  color: #7de0a0;
  display: block;
}
.feedback.wrong {
  background: #200a0a;
  border-left: 3px solid var(--red-lit);
  color: #e08080;
  display: block;
}
:root.light .feedback.correct { background: #c8eeda; color: #0d4a24; }
:root.light .feedback.wrong   { background: #f5d0d0; color: #6b1010; }

/* ── NAV (prev / next) ── */
.nav-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 4px 2px 30px;
}
.nav-btn {
  background: var(--surface);
  border: 2px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 15px; font-weight: 700;
  letter-spacing: 1px; text-transform: uppercase;
  padding: 12px 22px;
  cursor: pointer;
  transition: all .15s;
  flex: 1;
}
.nav-btn:hover:not(:disabled) {
  background: var(--accent);
  border-color: var(--accent2);
  color: #fff;
}
.nav-btn:disabled { opacity: .3; cursor: not-allowed; }
.nav-jump {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 15px; font-weight: 700;
  color: var(--muted);
  min-width: 70px;
  text-align: center;
}

/* ── NAME FIELD / TEST MODE / SEND STATUS ── */
.name-field { text-align: left; margin-bottom: 20px; }
.name-field label {
  display: block;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 11px; font-weight: 700;
  letter-spacing: 2px; text-transform: uppercase;
  color: var(--label); margin-bottom: 6px;
}
.name-field input {
  width: 100%;
  background: var(--surface);
  border: 2px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-family: 'Lato', sans-serif;
  font-size: 15px;
  padding: 10px 12px;
  outline: none;
  transition: border-color .15s;
}
.name-field input:focus { border-color: var(--accent2); }
.name-field input.invalid { border-color: var(--red-lit); }
.name-hint { font-size: 12px; color: var(--red-lit); margin-top: 4px; min-height: 16px; }

.choice-btn.selected {
  background: var(--accent);
  border-color: var(--accent2);
  color: #fff;
}
.tech-line { font-size: 13px; color: var(--muted); margin: -8px 0 16px; }
.tech-line strong { color: var(--text); }
.send-status { font-size: 13px; margin-top: 4px; min-height: 20px; }
.send-status.ok   { color: var(--green-lit); }
.send-status.fail { color: var(--red-lit); }
.send-status.busy { color: var(--muted); }
.primary-wide {
  width: 100%; margin-top: 16px; padding: 10px 18px;
}

/* ── PICKER MODAL ── */
#picker-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.7);
  z-index: 500;
  align-items: center;
  justify-content: center;
}
#picker-overlay.show { display: flex; }
.picker-box {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 32px 36px;
  max-width: 480px;
  width: 90%;
  text-align: center;
  box-shadow: 0 20px 60px rgba(0,0,0,.5);
}
.picker-eyebrow {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 11px; font-weight: 700;
  letter-spacing: 2px; text-transform: uppercase;
  color: var(--label); margin-bottom: 10px;
}
.picker-title {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 26px; font-weight: 700;
  color: var(--white); margin-bottom: 6px;
}
.picker-sub {
  font-size: 13px; color: var(--muted);
  margin-bottom: 24px;
}
.picker-options {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin-bottom: 20px;
}
.pick-btn {
  background: var(--surface);
  border: 2px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 22px; font-weight: 700;
  padding: 14px 8px;
  cursor: pointer;
  transition: all .15s;
  position: relative;
}
.pick-btn:hover:not(:disabled) {
  background: var(--accent);
  border-color: var(--accent2);
  color: #fff;
}
.pick-btn.selected {
  background: var(--accent);
  border-color: var(--accent2);
  color: #fff;
}
.pick-btn:disabled {
  opacity: .3;
  cursor: not-allowed;
}
.pick-btn .pick-label {
  display: block;
  font-size: 10px; font-weight: 400;
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-top: 2px;
  opacity: .7;
}
.picker-start {
  background: var(--accent);
  border: none; color: #fff;
  font-family: 'Lato', sans-serif;
  font-size: 14px; font-weight: 700;
  padding: 12px 36px;
  border-radius: 5px;
  cursor: pointer;
  letter-spacing: 1px;
  text-transform: uppercase;
  transition: background .15s;
  width: 100%;
}
.picker-start:hover { background: var(--accent2); }

/* ── TWO-PART TEST ── */
.part-tag {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 11px; font-weight: 700;
  letter-spacing: 1.5px; text-transform: uppercase;
  padding: 3px 9px; border-radius: 3px;
  color: #fff; background: var(--accent);
}
.part-tag.part-2 { background: var(--red); }
.q-prompt {
  font-family: 'Lato', sans-serif;
  font-size: 16px; font-weight: 700;
  color: var(--white);
  padding: 0 16px 10px;
}
.part-break { padding: 36px 32px; text-align: center; }
.part-break p { font-family: 'Lato', sans-serif; font-size: 15px; color: var(--text); line-height: 1.6; margin: 0 auto 12px; max-width: 560px; }
.break-eyebrow {
  font-family: 'Barlow Condensed', sans-serif; font-size: 12px; font-weight: 700;
  letter-spacing: 2px; text-transform: uppercase; color: var(--green-lit); margin-bottom: 6px;
}
.break-title {
  font-family: 'Barlow Condensed', sans-serif; font-size: 30px; font-weight: 700;
  color: var(--white); margin-bottom: 16px;
}
.break-warn { color: var(--red-lit); font-weight: 700; }
.break-go { max-width: 320px; margin-top: 10px; }
#part-scores { margin-bottom: 8px; }
.part-score {
  display: flex; justify-content: space-between;
  font-family: 'Lato', sans-serif; font-size: 14px; color: var(--text);
  padding: 8px 4px; border-bottom: 1px solid var(--border);
}
.part-score strong { color: var(--white); }

@media (max-width: 600px) {
  .choices { grid-template-columns: 1fr; }
  header h1 { font-size: 24px; }
  .score-btn { padding: 6px 10px; font-size: 11px; letter-spacing: 0; }
  .progress-bar-outer { width: 60px; }
  #progress-text { min-width: 36px; font-size: 12px; }
  .controls-inner { flex-wrap: nowrap; gap: 6px; }
  .nav-btn { padding: 12px 10px; font-size: 13px; }
}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="header-text">
      <div class="header-eyebrow">Pivotal Health · Cardiologs Platform Training</div>
      <h1>HRDP <span>Rhythm &amp; Rate Test</span></h1>
      <div class="header-sub"><span id="strip-count">—</span> Questions · Part 1: Rhythm · Part 2: Heart Rate Range</div>
    </div>
    <button id="theme-toggle" onclick="toggleTheme()" title="Toggle theme">🌙</button>
  </div>
</header>

<div class="controls">
  <div class="controls-inner">
    <div class="progress-wrap">
      <div class="progress-bar-outer">
        <div class="progress-bar-inner" id="progress-bar"></div>
      </div>
      <span id="progress-text">0 / 25</span>
    </div>
    <div class="spacer"></div>
    <span id="save-status"></span>
    <button class="score-btn" style="background:transparent;border:1px solid var(--border);color:var(--muted);margin-right:4px;" onmouseover="this.style.borderColor='var(--red-lit)';this.style.color='var(--red-lit)'" onmouseout="this.style.borderColor='var(--border)';this.style.color='var(--muted)'" onclick="resetDrill()">Reset</button>
    <button class="score-btn" id="score-btn" onclick="onScoreClick()">Score</button>
  </div>
</div>

<div id="picker-overlay">
  <div class="picker-box">
    <div class="picker-eyebrow">Pivotal Health · Cardiologs Platform Training</div>
    <div class="picker-title">Before you begin</div>
    <div class="picker-sub" id="picker-sub">Choose your session length</div>
    <div class="name-field">
      <label for="tech-name">Technician Name</label>
      <input type="text" id="tech-name" placeholder="First and last name" autocomplete="name"
        oninput="this.classList.remove('invalid');document.getElementById('name-hint').textContent=''">
      <div class="name-hint" id="name-hint"></div>
    </div>
    <button class="picker-start" id="picker-start" onclick="startDrill()">Start Test</button>
  </div>
</div>

<div id="score-summary">
  <div class="score-card-wrap">
    <h2>Test Results</h2>
    <div class="tech-line" id="tech-line"></div>
    <div class="total-score-row">
      <div>
        <div class="total-score-label">Total Score</div>
        <div class="total-score-num" id="score-num">—</div>
      </div>
      <div id="pass-fail"></div>
    </div>
    <div id="part-scores"></div>
    <div class="send-status" id="send-status"></div>
    <button class="score-btn primary-wide" id="submit-results-btn" onclick="onSubmitFromModal()" style="display:none;">Submit Results</button>
    <button class="score-btn primary-wide" id="resend-btn" onclick="sendResults()" style="display:none;">Try Sending Again</button>
    <button class="reset-btn" id="email-btn" onclick="emailResults()" style="width:100%;display:none;">Email Results Instead</button>
    <button class="reset-btn" onclick="resetDrill()" style="margin-top:20px;width:100%;">Reset &amp; Try Again</button>
    <button class="reset-btn" onclick="document.getElementById('score-summary').classList.remove('show')"
      style="margin-top:8px;width:100%;">Close</button>
  </div>
</div>

<main id="main"></main>

<script>
// ── FILE LOCATIONS (all relative — keep this file, /images/, answer_key.csv,
//    and answer_pool.json together in the same repo) ────────────────────────
const IMG_BASE  = './images/';
const CSV_URL   = './answer_key.csv';
const POOL_URL  = './answer_pool.json';

// ── TEST SETTINGS ───────────────────────────────────────────────────────────
// SUBMIT_URL: paste your Google Apps Script web app URL here (ends in /exec).
//   Leave blank and results won't be sent anywhere (score still shows).
const SUBMIT_URL    = 'https://script.google.com/macros/s/AKfycbz18sHTpqj7tf8qi1EsfPXq0J7xohnrIy6VG-ZsmTFTqcBggPDtb3oCpPqzKM9-edByfA/exec';
// RESULTS_EMAIL: optional backup — if sending fails, the tech can email results here.
const RESULTS_EMAIL = '';
const TEST_NAME     = 'HRDP Test: Rhythm & HR Range';
const PASS_PCT      = 80;
// TEST_MODE true  = no right/wrong shown until the tech submits; answers can be
//                   changed until then. Feedback appears for review after submitting.
// TEST_MODE false = drill behavior (instant feedback on every click).
const TEST_MODE     = true;

// ── HEART RATE RANGE SETTINGS (Part 2) ─────────────────────────────────────
// Wrong range choices are made by shifting / stretching the correct range.
// They never go below HR_MIN or above HR_MAX. Spacing is a multiple of HR_STEP.
const HR_MIN  = 30;
const HR_MAX  = 250;
const HR_STEP = 5;

// ── SECTIONS ───────────────────────────────────────────────────────────────
const PARTS = {
  1: { label: 'Part 1 · Rhythm',           short: 'Rhythm', prompt: 'What is the rhythm?' },
  2: { label: 'Part 2 · Heart Rate Range', short: 'HR',     prompt: 'What is the heart rate range?' }
};
const BREAK = '__part2__';   // marker in order[] for the "Part 1 complete" screen

// ── QUESTIONS + POOL — loaded from CSV / JSON ───────────────────────────────
// Each CSV row can make up to 2 questions:
//   Answer filled   → a Part 1 (rhythm) question
//   HR_Range filled → a Part 2 (heart rate range) question
let QUESTIONS = [];   // [{ key, id, part, correct, range? }]
let POOL = [];        // ["Normal Sinus Rhythm", ...]

// ── CSV PARSER ───────────────────────────────────────────────────────────
// Header row: ID,Answer,HR_Range   (column order doesn't matter; "Rhythm" works for Answer)
function parseCSV(text) {
  const lines = text.replace(/\r/g, '').trim().split('\n');
  const head = lines[0].split(',').map(h => h.trim().toLowerCase().replace(/[\s_]/g, ''));
  const col = names => head.findIndex(h => names.includes(h));
  const iId = col(['id', 'filename', 'file']);
  const iRhythm = col(['answer', 'rhythm']);
  const iRange = col(['hrrange', 'range', 'hr']);
  const out = [];
  lines.slice(1).forEach(line => {
    const cols = line.split(',').map(c => c.trim());
    const id = (cols[iId] || '').replace(/\.png$/i, '');
    if (!id) return;
    const rhythm = iRhythm >= 0 ? cols[iRhythm] : '';
    const rangeText = iRange >= 0 ? cols[iRange] : '';
    if (rhythm) out.push({ key: `${id}-r`, id, part: 1, correct: rhythm });
    if (rangeText) {
      const range = parseRange(rangeText);
      if (range) out.push({ key: `${id}-hr`, id, part: 2, correct: fmtRange(range), range });
      else console.warn(`${id}: couldn't read HR_Range "${rangeText}" (use a format like 60-100)`);
    }
  });
  return out;
}

// ── HEART RATE RANGES ─────────────────────────────────────────────────────
// Accepts 60-100, 60–100, 60 - 100, 60 to 100, 60-100 bpm
function parseRange(s) {
  const m = String(s).match(/(\d+)\s*(?:-|–|—|to)\s*(\d+)/i);
  if (!m) return null;
  let a = +m[1], b = +m[2];
  if (a > b) [a, b] = [b, a];
  return [a, b];
}
function fmtRange([a, b]) { return `${a}–${b} bpm`; }

// 3 believable wrong ranges. The 4 choices form a "ladder" of ranges spaced
// STEP bpm apart (bigger ranges get bigger spacing), and the correct one is
// placed at a random rung, so it isn't always the middle choice. Wrong ranges
// also get a little width variation so they don't all look identical.
function rangeDistractors([lo, hi]) {
  const span = hi - lo;
  const step = Math.max(15, Math.round(span * 0.25 / HR_STEP) * HR_STEP);
  const minWidth = Math.min(10, span);
  // windows of 4 rungs that include 0 (the correct range): k = start..start+3.
  // Prefer windows where at most one range has to be trimmed at 30 or 250,
  // so the wrong answers don't pile up at the edge of the scale.
  const outside = st => [0, 1, 2, 3].filter(i => lo + (st + i) * step < HR_MIN || hi + (st + i) * step > HR_MAX).length;
  const all = shuffle([-3, -2, -1, 0]);
  const best = Math.max(1, Math.min(...all.map(outside)));
  const starts = all.filter(st => outside(st) <= best);
  const seen = new Set([`${lo}-${hi}`]);
  const out = [];
  const tryAdd = (a, b) => {
    a = Math.max(HR_MIN, a); b = Math.min(HR_MAX, b);
    const k = `${a}-${b}`;
    if (b - a < minWidth || seen.has(k)) return;
    seen.add(k); out.push([a, b]);
  };
  for (const st of starts) {
    [0, 1, 2, 3].map(i => st + i).filter(k => k !== 0).forEach(k => {
      const j = Math.min(HR_STEP * 2, Math.floor(span * 0.15 / HR_STEP) * HR_STEP);
      const jitter = [-j, 0, j][Math.floor(Math.random() * 3)];
      const side = Math.random() < 0.5;
      tryAdd(lo + k * step + (side ? jitter : 0), hi + k * step + (side ? 0 : jitter));
    });
    if (out.length >= 3) break;
    out.length = 0; seen.clear(); seen.add(`${lo}-${hi}`);   // window didn't work cleanly, try the next
  }
  // Fallback for ranges squeezed against 30 or 250: widen / narrow instead
  for (let d = step; out.length < 3 && d < 200; d += HR_STEP) {
    tryAdd(lo - d, hi + d); tryAdd(lo + d, hi - d); tryAdd(lo, hi + d); tryAdd(lo - d, hi);
  }
  return out.slice(0, 3).map(fmtRange);
}

// ── STATE ─────────────────────────────────────────────────────────────────
const STORE = 'cct_hrdp_test_v2';
let answered = {};   // { key: chosenAnswer }
let options = {};    // { key: [4 shuffled choices] }  -- fixed once generated, persisted
let order = [];      // part 1 keys, BREAK, part 2 keys
let cursor = 0;      // index into order[] currently displayed
let techName = '';
let submitted = false;   // true once the tech submits — locks answers
let attemptId = '';      // one id per submission, so a resend doesn't look like a new attempt
let sentOK = false;

const getQ = key => QUESTIONS.find(q => q.key === key);
const qKeys = () => order.filter(k => k !== BREAK);

// ── PERSISTENCE ──────────────────────────────────────────────────────────
function save() {
  try {
    localStorage.setItem(STORE, JSON.stringify({ answered, order, options, cursor, techName, submitted, attemptId, sentOK }));
    showSaveStatus('✓ Saved', 'var(--green-lit)');
  } catch (e) {}
}

function load() {
  try {
    const raw = localStorage.getItem(STORE);
    if (!raw) return false;
    const d = JSON.parse(raw);
    answered = d.answered || {};
    order = d.order || [];
    options = d.options || {};
    cursor = d.cursor || 0;
    techName = d.techName || '';
    submitted = !!d.submitted;
    attemptId = d.attemptId || '';
    sentOK = !!d.sentOK;
    return order.length > 0;
  } catch (e) { return false; }
}

let saveTimer;
function scheduleSave() {
  clearTimeout(saveTimer);
  showSaveStatus('● Saving…', 'var(--muted)');
  saveTimer = setTimeout(save, 600);
}

function showSaveStatus(msg, color) {
  const el = document.getElementById('save-status');
  el.textContent = msg;
  el.style.color = color;
  el.style.opacity = '1';
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { el.style.opacity = '0'; }, 2500);
}

window.addEventListener('beforeunload', () => {
  if (Object.keys(answered).length > 0) save();
});

// ── SHUFFLE ───────────────────────────────────────────────────────────────
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Build 4 answer choices: correct + 3 distractors
function buildOptions(q) {
  if (q.part === 2) return shuffle([q.correct, ...rangeDistractors(q.range)]);
  const c = q.correct.toLowerCase();
  const distractorPool = POOL.filter(a => a.toLowerCase() !== c);
  return shuffle([q.correct, ...shuffle(distractorPool).slice(0, 3)]);
}

// ── START SCREEN ──────────────────────────────────────────────────────────
function showPicker() {
  const n1 = QUESTIONS.filter(q => q.part === 1).length;
  const n2 = QUESTIONS.filter(q => q.part === 2).length;
  try { document.getElementById('tech-name').value = localStorage.getItem('cct_tech_name') || ''; } catch (e) {}
  document.getElementById('picker-sub').textContent =
    `Part 1: ${n1} rhythm question${n1 !== 1 ? 's' : ''} · Part 2: ${n2} heart rate question${n2 !== 1 ? 's' : ''}`;
  document.getElementById('picker-overlay').classList.add('show');
}

function newOrder() {
  const p1 = shuffle(QUESTIONS.filter(q => q.part === 1).map(q => q.key));
  const p2 = shuffle(QUESTIONS.filter(q => q.part === 2).map(q => q.key));
  return p1.length && p2.length ? [...p1, BREAK, ...p2] : [...p1, ...p2];
}

function startDrill() {
  const nameInput = document.getElementById('tech-name');
  const name = nameInput.value.trim().replace(/\s+/g, ' ');
  if (name.split(' ').length < 2) {
    nameInput.classList.add('invalid');
    document.getElementById('name-hint').textContent = 'Please enter your first and last name.';
    nameInput.focus();
    return;
  }
  techName = name;
  try { localStorage.setItem('cct_tech_name', name); } catch (e) {}
  document.getElementById('picker-overlay').classList.remove('show');
  answered = {};
  options = {};
  cursor = 0;
  submitted = false;
  attemptId = '';
  sentOK = false;
  order = newOrder();
  qKeys().forEach(k => { options[k] = buildOptions(getQ(k)); });
  save();
  buildDrill();
}

// ── BUILD ─────────────────────────────────────────────────────────────────
function buildDrill() {
  const keys = qKeys();
  keys.forEach(k => { if (!options[k]) options[k] = buildOptions(getQ(k)); });
  document.getElementById('strip-count').textContent = keys.length;
  document.title = `HRDP Test (${keys.length} questions)`;
  if (cursor >= order.length) cursor = 0;
  updateScoreButton();
  renderCard();
  updateProgress();
}

function navBar() {
  const total = order.length;
  return `
    <div class="nav-bar">
      <button class="nav-btn" id="prev-btn" onclick="goPrev()" ${cursor === 0 ? 'disabled' : ''}>◀ Previous</button>
      <span class="nav-jump">${cursor + 1} / ${total}</span>
      <button class="nav-btn" id="next-btn" onclick="goNext()" ${cursor === total - 1 ? 'disabled' : ''}>Next ▶</button>
    </div>`;
}

function renderBreak() {
  const p1 = qKeys().filter(k => getQ(k).part === 1);
  const p2n = qKeys().length - p1.length;
  const done = p1.filter(k => answered[k]).length;
  const left = p1.length - done;
  document.getElementById('main').innerHTML = `
    <div class="q-card part-break">
      <div class="break-eyebrow">Part 1 Complete</div>
      <div class="break-title">${PARTS[2].label}</div>
      <p>You answered <strong>${done} of ${p1.length}</strong> rhythm questions.
        ${left && !submitted ? `<br><span class="break-warn">${left} still unanswered. Use Previous to go back.</span>` : ''}</p>
      <p>Next are <strong>${p2n}</strong> heart rate density plots. For each one, choose the heart rate range that best matches the plot.</p>
      <button class="picker-start break-go" onclick="goNext()">Continue to Part 2 ▶</button>
    </div>
    ${navBar()}`;
}

function renderCard() {
  const key = order[cursor];
  if (key === BREAK) return renderBreak();
  const q = getQ(key);
  if (!q) return;

  const inPart = order.filter(k => k !== BREAK && getQ(k).part === q.part);
  const num = inPart.indexOf(key) + 1;
  const choices = options[key] || (options[key] = buildOptions(q));

  document.getElementById('main').innerHTML = `
    <div class="q-card" id="card-${key}">
      <div class="q-header">
        <span class="part-tag part-${q.part}">${PARTS[q.part].label}</span>
        <span class="q-num">${String(num).padStart(2, '0')} of ${inPart.length}</span>
        <span class="q-status" id="status-${key}"></span>
      </div>
      <div class="q-prompt">${PARTS[q.part].prompt}</div>
      <div class="strip-wrap">
        <img class="strip-img"
          src="${IMG_BASE}${q.id}.png"
          alt="HRDP ${q.id}"
          onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
        <div style="display:none;align-items:center;justify-content:center;height:120px;
          border:2px dashed var(--border);border-radius:6px;color:var(--muted);font-size:13px;">
          Image not found: ${q.id}.png
        </div>
      </div>
      <div class="choices" id="choices-${key}">
        ${choices.map(c => `
          <button class="choice-btn"
            data-choice="${c.replace(/"/g, '&quot;')}"
            onclick="handleAnswer('${key}', this.dataset.choice)">
            ${c}
          </button>`).join('')}
      </div>
      <div class="feedback" id="fb-${key}"></div>
    </div>
    ${navBar()}`;

  if (answered[key]) restoreAnswer(key);
  else if (submitted) revealUnanswered(key);
}

function revealUnanswered(key) {
  const q = getQ(key);
  const card = document.getElementById(`card-${key}`);
  if (!q || !card) return;
  card.querySelectorAll('.choice-btn').forEach(btn => {
    btn.disabled = true;
    if (btn.dataset.choice === q.correct) btn.classList.add('reveal');
  });
  card.classList.add('wrong');
  document.getElementById(`status-${key}`).textContent = '✗';
  const fb = document.getElementById(`fb-${key}`);
  fb.className = 'feedback wrong';
  fb.textContent = `Not answered. The answer is ${q.correct}.`;
}

function goPrev() {
  if (cursor > 0) { cursor--; save(); renderCard(); }
}
function goNext() {
  if (cursor < order.length - 1) { cursor++; save(); renderCard(); }
}

// ── ANSWER HANDLING ──────────────────────────────────────────────────────
function handleAnswer(key, choice) {
  if (submitted) return;
  if (!TEST_MODE && answered[key]) return;
  answered[key] = choice;
  restoreAnswer(key);
  updateProgress();
  scheduleSave();
}

function restoreAnswer(key) {
  const q = getQ(key);
  if (!q) return;
  const chosen = answered[key];
  const isCorrect = chosen === q.correct;
  const card = document.getElementById(`card-${key}`);
  const fb = document.getElementById(`fb-${key}`);
  const status = document.getElementById(`status-${key}`);
  if (!card) return;

  // Test mode, not yet submitted: just highlight their pick, no right/wrong
  if (TEST_MODE && !submitted) {
    card.querySelectorAll('.choice-btn').forEach(btn => {
      btn.classList.toggle('selected', btn.dataset.choice === chosen);
    });
    return;
  }

  card.querySelectorAll('.choice-btn').forEach(btn => {
    btn.disabled = true;
    const val = btn.dataset.choice;
    if (val === chosen && isCorrect)  btn.classList.add('correct');
    else if (val === chosen)          btn.classList.add('wrong');
    else if (val === q.correct)       btn.classList.add('reveal');
  });

  card.classList.add(isCorrect ? 'correct' : 'wrong');
  status.textContent = isCorrect ? '✓' : '✗';

  fb.className = 'feedback ' + (isCorrect ? 'correct' : 'wrong');
  fb.textContent = isCorrect
    ? `Correct! The answer is ${q.correct}.`
    : `Incorrect. The answer is ${q.correct}, not ${chosen}.`;
}

// ── PROGRESS ──────────────────────────────────────────────────────────────
function updateProgress() {
  const total = qKeys().length;
  const done = qKeys().filter(k => answered[k]).length;
  const pct = total > 0 ? (done / total) * 100 : 0;
  document.getElementById('progress-bar').style.width = pct + '%';
  document.getElementById('progress-text').textContent = `${done} / ${total}`;
}

// ── SCORE + SUBMIT ────────────────────────────────────────────────────────
function tallyOf(qs) {
  const total = qs.length;
  const correct = qs.filter(q => answered[q.key] === q.correct).length;
  const pct = total > 0 ? Math.round(correct / total * 100) : 0;
  return { total, correct, pct };
}

function getTally() {
  const qs = qKeys().map(getQ).filter(Boolean);
  const t = tallyOf(qs);
  return {
    qs, ...t, pass: t.pct >= PASS_PCT,
    part1: tallyOf(qs.filter(q => q.part === 1)),
    part2: tallyOf(qs.filter(q => q.part === 2))
  };
}

function updateScoreButton() {
  const btn = document.getElementById('score-btn');
  if (!btn) return;
  btn.textContent = submitted ? 'Results' : (TEST_MODE ? 'Submit' : 'Score');
}

function onScoreClick() {
  if (!order.length) return;
  if (TEST_MODE && !submitted) {
    if (!confirmSubmit()) return;
    submitTest();
  }
  showScore();
}

function onSubmitFromModal() {
  if (!confirmSubmit()) return;
  submitTest();
  showScore();
}

function confirmSubmit() {
  const left = qKeys().filter(k => !answered[k]).length;
  const msg = left > 0
    ? `You have ${left} unanswered question${left !== 1 ? 's' : ''}. Unanswered questions count as wrong.\n\nSubmit now?`
    : 'Submit your results? Your answers will be locked.';
  return confirm(msg);
}

function submitTest() {
  submitted = true;
  attemptId = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  save();
  updateScoreButton();
  renderCard();
  sendResults();
}

function showScore() {
  if (!order.length) return;
  const { total, correct, pct, pass, part1, part2 } = getTally();

  document.getElementById('tech-line').innerHTML = techName
    ? `Technician: <strong>${techName.replace(/</g, '&lt;')}</strong>` : '';
  document.getElementById('score-num').textContent = `${correct} / ${total} (${pct}%)`;
  const row = (label, t) => t.total
    ? `<div class="part-score"><span>${label}</span><strong>${t.correct} / ${t.total} (${t.pct}%)</strong></div>` : '';
  document.getElementById('part-scores').innerHTML =
    row(PARTS[1].label, part1) + row(PARTS[2].label, part2);
  const badge = document.getElementById('pass-fail');
  badge.className = pass ? 'pass-badge' : 'fail-badge';
  badge.textContent = pct === 100 ? 'PERFECT' : (pass ? 'PASSING' : 'NEEDS WORK');

  document.getElementById('submit-results-btn').style.display = submitted ? 'none' : 'block';
  if (submitted && sentOK) setSendStatus('✓ Results sent', 'ok');
  else if (!submitted) setSendStatus('', '');

  document.getElementById('score-summary').classList.add('show');
}

function buildResults() {
  const { qs, total, correct, pct, pass, part1, part2 } = getTally();
  return {
    test: TEST_NAME,
    name: techName,
    attemptId,
    submittedAt: new Date().toISOString(),
    correct, total, pct,
    result: pass ? 'PASS' : 'NEEDS WORK',
    part1Score: `${part1.correct}/${part1.total}`,
    part2Score: `${part2.correct}/${part2.total}`,
    answers: qs.map((q, i) => ({
      num: i + 1,
      id: `${q.id} · ${PARTS[q.part].short}`,   // e.g. "hrdp004 · HR" so both parts are clear in the sheet
      part: q.part,
      chosen: answered[q.key] || '',
      correct: q.correct,
      isCorrect: answered[q.key] === q.correct
    }))
  };
}

function setSendStatus(msg, kind) {
  const el = document.getElementById('send-status');
  el.textContent = msg;
  el.className = 'send-status ' + (kind || '');
  const failed = kind === 'fail';
  document.getElementById('resend-btn').style.display = failed && SUBMIT_URL ? 'block' : 'none';
  document.getElementById('email-btn').style.display = failed && RESULTS_EMAIL ? 'block' : 'none';
}

async function sendResults() {
  if (!SUBMIT_URL) {
    setSendStatus(RESULTS_EMAIL ? 'Results were not sent automatically.' : '', RESULTS_EMAIL ? 'fail' : '');
    return;
  }
  setSendStatus('Sending results…', 'busy');
  try {
    // text/plain + no-cors avoids the CORS preflight that Apps Script can't answer.
    // The response is opaque, so a resolved fetch = request delivered.
    await fetch(SUBMIT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(buildResults())
    });
    sentOK = true;
    save();
    setSendStatus('✓ Results sent', 'ok');
  } catch (e) {
    console.error('Send failed:', e);
    setSendStatus('Couldn\'t send results — check your connection.', 'fail');
  }
}

function emailResults() {
  const r = buildResults();
  const missed = r.answers.filter(a => !a.isCorrect)
    .map(a => `#${a.num} (${a.id}): answered "${a.chosen || 'blank'}", correct "${a.correct}"`);
  const body = [
    `Technician: ${r.name}`,
    `Test: ${r.test}`,
    `Score: ${r.correct}/${r.total} (${r.pct}%) — ${r.result}`,
    `Part 1 (Rhythm): ${r.part1Score} · Part 2 (HR Range): ${r.part2Score}`,
    `Submitted: ${new Date(r.submittedAt).toLocaleString()}`,
    '',
    missed.length ? 'Missed:' : 'No missed questions.',
    ...missed
  ].join('\n');
  const subject = `${r.test} — ${r.name} — ${r.pct}%`;
  location.href = `mailto:${RESULTS_EMAIL}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
}

function resetDrill() {
  if (!confirm('Reset all answers and start over?')) return;
  answered = {};
  options = {};
  order = [];
  cursor = 0;
  submitted = false;
  try { localStorage.removeItem(STORE); } catch (e) {}
  document.getElementById('score-summary').classList.remove('show');
  location.reload();
}

// ── THEME ─────────────────────────────────────────────────────────────────
function applyTheme(t) {
  document.documentElement.classList.toggle('light', t === 'light');
  document.getElementById('theme-toggle').textContent = t === 'light' ? '☀️' : '🌙';
}
function toggleTheme() {
  const next = document.documentElement.classList.contains('light') ? 'dark' : 'light';
  applyTheme(next);
  try { localStorage.setItem('cct_theme', next); } catch (e) {}
}

// ── INIT ──────────────────────────────────────────────────────────────────
(function() {
  try { applyTheme(localStorage.getItem('cct_theme') === 'light' ? 'light' : 'dark'); }
  catch (e) { applyTheme('dark'); }

  document.getElementById('main').innerHTML =
    '<div style="text-align:center;padding:60px;color:var(--muted);font-size:14px;">Loading HRDPs…</div>';

  Promise.all([
    fetch(CSV_URL + '?cb=' + Date.now()).then(r => {
      if (!r.ok) throw new Error('answer_key.csv not found');
      return r.text();
    }),
    fetch(POOL_URL + '?cb=' + Date.now()).then(r => {
      if (!r.ok) throw new Error('answer_pool.json not found');
      return r.json();
    })
  ]).then(([csvText, poolJson]) => {
    QUESTIONS = parseCSV(csvText);
    POOL = poolJson;
    if (!QUESTIONS.length) throw new Error('No questions parsed from CSV');
    if (!Array.isArray(POOL) || POOL.length < 4) throw new Error('Answer pool needs at least 4 entries');

    // Flag rhythm answers that aren't spelled the same as in the pool
    const poolLower = POOL.map(p => p.toLowerCase());
    QUESTIONS.filter(q => q.part === 1 && !poolLower.includes(q.correct.toLowerCase()))
      .forEach(q => console.warn(`${q.id}: "${q.correct}" is not in answer_pool.json`));

    const hadProgress = load();

    // If the CSV changed since this session started, start fresh
    if (order.length && !qKeys().every(k => getQ(k))) {
      order = []; answered = {}; options = {}; cursor = 0;
    }

    if (hadProgress && order.length && techName) {
      buildDrill();
      const el = document.getElementById('save-status');
      el.textContent = submitted
        ? `↩ Submitted results for ${techName}`
        : `↩ Progress restored (${Object.keys(answered).length} answered)`;
      el.style.color = 'var(--accent2)';
      el.style.opacity = '1';
      setTimeout(() => { el.style.opacity = '0'; }, 4000);
      // Submitted earlier but the send never went through — try again quietly
      if (submitted && !sentOK && SUBMIT_URL) sendResults();
    } else {
      showPicker();
    }
  }).catch(err => {
    document.getElementById('main').innerHTML =
      `<div style="text-align:center;padding:60px;color:var(--red-lit);font-size:14px;">
        Could not load quiz data.<br>
        <span style="color:var(--muted);font-size:12px;">Make sure answer_key.csv and answer_pool.json are in the repo root, images/ has the HRDP PNGs, and GitHub Pages is enabled.</span>
      </div>`;
    console.error('Load error:', err);
  });
})();
</script>
</body>
</html>
